<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">beans-memory</title>
  <desc id="desc">A peanut cracked open, shell halves peeled back, two beans inside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF7EA"/>
      <stop offset="1" stop-color="#F3E6CF"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D79A5B"/>
      <stop offset="1" stop-color="#B9773C"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C08A"/>
      <stop offset="1" stop-color="#D8A468"/>
    </linearGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C879"/>
      <stop offset="1" stop-color="#DCA24F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#8A5A2F" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#8A5A2F" opacity="0.16"/>
      <circle cx="15" cy="14" r="1.6" fill="#8A5A2F" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="600" rx="36" fill="url(#bg)"/>
  <ellipse cx="400" cy="486" rx="250" ry="34" fill="#C9A472" opacity="0.28"/>

  <!-- left shell half -->
  <g transform="translate(300 300) rotate(-20)" filter="url(#shadow)">
    <path d="M-130 30 C-160 -50 -110 -140 -20 -158 C70 -176 150 -120 162 -40 C172 28 130 108 50 142 C-30 175 -100 120 -130 30 Z"
          fill="url(#shell)" stroke="#7E4F27" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-118 28 C-140 -38 -98 -112 -22 -128 C54 -144 120 -98 130 -34 C138 22 104 88 38 116 C-28 144 -88 96 -118 28 Z"
          fill="url(#inner)" stroke="#7E4F27" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-118 28 C-140 -38 -98 -112 -22 -128 C54 -144 120 -98 130 -34 C138 22 104 88 38 116 C-28 144 -88 96 -118 28 Z"
          fill="url(#dots)" opacity="0.85"/>
    <path d="M-96 -84 C-62 -118 -8 -126 34 -108" fill="none" stroke="#F3D3A6" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- right shell half -->
  <g transform="translate(500 300) rotate(20)" filter="url(#shadow)">
    <path d="M130 30 C160 -50 110 -140 20 -158 C-70 -176 -150 -120 -162 -40 C-172 28 -130 108 -50 142 C30 175 100 120 130 30 Z"
          fill="url(#shell)" stroke="#7E4F27" stroke-width="8" stroke-linejoin="round"/>
    <path d="M118 28 C140 -38 98 -112 22 -128 C-54 -144 -120 -98 -130 -34 C-138 22 -104 88 -38 116 C28 144 88 96 118 28 Z"
          fill="url(#inner)" stroke="#7E4F27" stroke-width="6" stroke-linejoin="round"/>
    <path d="M118 28 C140 -38 98 -112 22 -128 C-54 -144 -120 -98 -130 -34 C-138 22 -104 88 -38 116 C28 144 88 96 118 28 Z"
          fill="url(#dots)" opacity="0.85"/>
    <path d="M96 -84 C62 -118 8 -126 -34 -108" fill="none" stroke="#F3D3A6" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- beans -->
  <g filter="url(#shadow)">
    <g transform="translate(356 322) rotate(-14)">
      <ellipse rx="74" ry="54" fill="url(#bean)" stroke="#7E4F27" stroke-width="7"/>
      <path d="M-42 -18 C-22 -40 22 -42 44 -20" fill="none" stroke="#FFE2AE" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g transform="translate(456 330) rotate(12)">
      <ellipse rx="70" ry="52" fill="url(#bean)" stroke="#7E4F27" stroke-width="7"/>
      <path d="M-40 -16 C-20 -38 20 -40 42 -18" fill="none" stroke="#FFE2AE" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>
