name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.7"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests
        run: bun test

      - name: Set up Node for npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use the latest npm
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$expected" = "$TAG"

      - name: Publish with provenance
        run: npm publish --provenance --access public
