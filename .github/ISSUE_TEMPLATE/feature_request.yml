name: Feature request
description: Propose a new capability or integration.
title: "[feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want. Include commands or config examples when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or simpler approaches.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - OpenCode plugin
        - MCP server
        - CLI
        - Installer
        - Import or migration
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This fits the local-first, single-file design.
          required: true
